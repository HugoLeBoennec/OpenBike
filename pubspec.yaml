name: open_bike
description: Open-source indoor cycling app — smart trainer control, structured workouts, route simulation.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Immutable data classes
  freezed_annotation: ^2.4.4

  # Navigation
  go_router: ^14.8.1

  # Persistence
  drift: ^2.20.3
  sqlite3_flutter_libs: ^0.5.24

  # BLE
  flutter_blue_plus: ^1.36.8

  # Permissions
  permission_handler: ^11.3.1

  # Logging
  logging: ^1.3.0

  # File formats
  xml: ^6.6.1
  gpx: ^2.3.0

  # UUID generation
  uuid: ^4.5.2

  # File picking
  file_picker: ^8.0.0

  # Path utilities
  path_provider: ^2.1.5
  path: ^1.9.1

  # Networking & export
  http: ^1.3.0
  url_launcher: ^6.3.2
  flutter_secure_storage: ^9.2.4
  connectivity_plus: ^6.1.4

  # Charts
  fl_chart: ^0.70.2

  # Preferences
  shared_preferences: ^2.3.4

  # Screen wakelock
  wakelock_plus: ^1.2.8


dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

  # Code generation
  build_runner: ^2.4.14
  freezed: ^2.5.8
  drift_dev: ^2.20.3

  # App icon & splash
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
