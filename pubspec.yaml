name: open_bike
description: Open-source indoor cycling app — smart trainer control, structured workouts, route simulation.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Immutable data classes
  freezed_annotation: ^2.4.4

  # Navigation
  go_router: ^14.8.1

  # Persistence
  drift: ^2.20.3
  sqlite3_flutter_libs: ^0.5.24

  # BLE — 2.x adds native Windows (winrt) + Linux (BlueZ) platform backends,
  # gated internally by the plugin itself via federated dependencies (no
  # separate flutter_blue_plus_windows/universal_ble package or app-level
  # backend-selection code needed). See docs/roadmap/P2-connectivity.md.
  flutter_blue_plus: ^2.3.10

  # Permissions
  permission_handler: ^11.3.1

  # Logging
  logging: ^1.3.0

  # File formats
  xml: ^6.6.1
  gpx: ^2.3.0

  # UUID generation
  uuid: ^4.5.2

  # File picking
  file_picker: ^8.0.0

  # Path utilities
  path_provider: ^2.1.5
  path: ^1.9.1

  # Networking & export
  http: ^1.3.0
  url_launcher: ^6.3.2
  flutter_secure_storage: ^9.2.4
  connectivity_plus: ^6.1.4

  # Deep link handling (Strava OAuth callback — see P6-integrations.md)
  app_links: ^7.0.0

  # Charts
  fl_chart: ^0.70.2

  # Mini-map (route ride, stretch — behind a toggle, see P3-ride-experience.md)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Preferences
  shared_preferences: ^2.3.4

  # Screen wakelock
  wakelock_plus: ^1.2.8

  # Android foreground service for background recording
  flutter_foreground_task: ^9.2.2

  # Desktop window management (macOS/Windows/Linux) — min size, remembered
  # size/position, title, fullscreen toggle. See P8-desktop.md.
  window_manager: ^0.4.3

  # dart:ffi convenience helpers (Utf8/calloc) for LibusbBackend — see
  # lib/infrastructure/ant/libusb_backend.dart and P8-desktop.md §5. Already
  # resolved transitively via flutter_secure_storage_windows; pinned
  # directly since we call into it too.
  ffi: ^2.1.0

  # Opt-in crash reporting (default off) — see
  # lib/infrastructure/observability/crash_reporting_service.dart and
  # docs/release/analytics.md. Only initialized when a DSN is supplied via
  # --dart-define=SENTRY_DSN at build time; a build with no DSN never talks
  # to Sentry at all, opt-in or not.
  sentry_flutter: ^9.24.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

  # Code generation
  build_runner: ^2.4.14
  freezed: ^2.5.8
  drift_dev: ^2.20.3

  # App icon & splash
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

  # Windows MSIX packaging (release CI job — see P8-desktop.md)
  msix: ^3.16.9

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

# Windows MSIX packaging config (`dart run msix:create` — see
# docs/roadmap/P8-desktop.md §3). No certificate_path/certificate_password
# set here: the msix tool self-signs with a generated test certificate,
# which is fine for CI artifacts and sideloading; a real code-signing
# certificate is a P9 store-signing decision.
msix_config:
  display_name: OpenBike
  publisher_display_name: OpenBike
  identity_name: com.openbike.openBike
  logo_path: assets/icon/app_icon.png
  capabilities: internetClient, bluetooth
