# Launcher icons for every target platform. Masters live in `assets/icon/`
# (source package with the vector originals and per-platform renders is in
# `branding/`). Regenerate with `dart run flutter_launcher_icons` after
# changing a master — see docs/release/assets.md.
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"

  android: true
  min_sdk_android: 23
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  # Android 13+ themed icons.
  adaptive_icon_monochrome: "assets/icon/app_icon_monochrome.png"
  # The foreground/monochrome masters are already drawn inside the 683px
  # adaptive safe zone, so the tool's default 16% inset would shrink the mark
  # a second time.
  adaptive_icon_foreground_inset: 0

  ios: true
  # The App Store rejects a marketing icon with an alpha channel.
  remove_alpha_ios: true

  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"

  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256

  # Web is out of scope for now — leave web/ untouched.
  web:
    generate: false
