name: Bug report
description: Something works incorrectly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For security vulnerabilities, **do not use this form** — follow
        [SECURITY.md](https://github.com/HugoLeBoennec/OpenBike/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you expected, and what happened instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Android, iOS, macOS, Windows, Linux]
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: App version and OS version
      description: The app version is in Settings → OpenBike.
      placeholder: "OpenBike 1.0.0, Android 15"
    validations:
      required: true

  - type: input
    id: hardware
    attributes:
      label: Trainer / sensor involved
      description: Leave blank if the bug isn't connectivity-related.
      placeholder: "Wahoo KICKR Core, Garmin HRM-Dual"

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >
        Optional. Output from `flutter run` or a
        `--dart-define=DEV_MODE=true` build is especially useful.
      render: shell
