name: Feature request
description: Suggest a capability or change
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please check
        [CONTRIBUTING.md](https://github.com/HugoLeBoennec/OpenBike/blob/main/CONTRIBUTING.md#what-is-unlikely-to-be-merged)
        first — analytics, tracking, and web support are deliberate non-goals.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: >
        Describe the situation you're in, not the implementation you have in
        mind. What are you trying to do today, and what makes it hard?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Including workarounds you're using now.
