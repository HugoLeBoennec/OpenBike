name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

env:
  # pubspec.lock was generated with dart >=3.10 / flutter >=3.38 — keep in sync.
  FLUTTER_VERSION: '3.47.x'

jobs:
  # The open-core seam (docs/release/private-plugins.md) keeps the Records and
  # OpenCoach integrations in a separate private package. Nothing about either
  # service may land here. This runs on every push and PR because the failure
  # mode — a private endpoint or credential committed to a public repo — is not
  # something a later revert undoes.
  private-leak-guard:
    name: No private-service code in the public repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Scoped to lib/ deliberately. test/ legitimately names both services —
      # private_plugins_test.dart and connections_section_test.dart use fakes
      # like FakeOpenCoachDevicePlugin to prove the seam registers whatever the
      # hooks return, which is exactly the mechanism this guard protects.
      - name: Assert no private integration details in lib/
        run: |
          if grep -rniE 'opencoach|records_api' lib/; then
            echo "::error::Private integration details found above. Records and OpenCoach live in openbike_private_plugins — see docs/release/private-plugins.md."
            exit 1
          fi

      # Matches an actual import/export directive, not a mention: the stub's own
      # doc comment names the package when explaining what release builds swap in.
      - name: Assert the private-plugin stub has not been swapped in
        run: |
          if grep -nE "^\s*(import|export)\s+'package:openbike_private_plugins" lib/plugins/private_registration.dart; then
            echo "::error::lib/plugins/private_registration.dart pulls in the private package. That swap is a release-build-only step and must never be committed — see docs/release/private-plugins.md."
            exit 1
          fi

  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze

  test:
    name: Unit & widget tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test

  build-android:
    name: Build Android (debug APK)
    runs-on: ubuntu-latest
    needs: [analyze, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug

  build-ios:
    name: Build iOS (no codesign)
    runs-on: macos-latest
    needs: [analyze, test]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --debug --no-codesign

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    needs: [analyze, test]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build macos --debug

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: [analyze, test]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --debug

  build-linux:
    name: Build Linux (best-effort)
    runs-on: ubuntu-latest
    needs: [analyze, test]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev libjsoncpp-dev libcurl4-openssl-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build linux --debug
      - name: Package tar.gz bundle
        run: |
          cd build/linux/x64/debug/bundle
          tar czf ../../../../../OpenBike-linux-x64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: OpenBike-linux-x64
          path: OpenBike-linux-x64.tar.gz
          if-no-files-found: error

  # Tag-triggered release packaging (signed AAB/IPA/DMG/MSIX + Linux
  # tar.gz, attached to a GitHub Release) lives in its own workflow now —
  # see .github/workflows/release.yml and docs/release/checklist.md. It was
  # dead code here: this workflow's `push.branches` trigger never fires for
  # tag pushes in the first place, so the old `if: startsWith(github.ref,
  # 'refs/tags/')` jobs never actually ran.
