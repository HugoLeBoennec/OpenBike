name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

env:
  # pubspec.lock was generated with dart >=3.10 / flutter >=3.38 — keep in sync.
  FLUTTER_VERSION: '3.38.x'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze

  test:
    name: Unit & widget tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test

  build-android:
    name: Build Android (debug APK)
    runs-on: ubuntu-latest
    needs: [analyze, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug

  build-ios:
    name: Build iOS (no codesign)
    runs-on: macos-latest
    needs: [analyze, test]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --debug --no-codesign

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    needs: [analyze, test]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build macos --debug

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: [analyze, test]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --debug

  build-linux:
    name: Build Linux (best-effort)
    runs-on: ubuntu-latest
    needs: [analyze, test]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev libjsoncpp-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build linux --debug
      - name: Package tar.gz bundle
        run: |
          cd build/linux/x64/debug/bundle
          tar czf ../../../../../OpenBike-linux-x64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: OpenBike-linux-x64
          path: OpenBike-linux-x64.tar.gz
          if-no-files-found: error

  # Tag-triggered release packaging (signed AAB/IPA/DMG/MSIX + Linux
  # tar.gz, attached to a GitHub Release) lives in its own workflow now —
  # see .github/workflows/release.yml and docs/release/checklist.md. It was
  # dead code here: this workflow's `push.branches` trigger never fires for
  # tag pushes in the first place, so the old `if: startsWith(github.ref,
  # 'refs/tags/')` jobs never actually ran.
