name: Release

# Tag-driven release packaging — see docs/release/checklist.md. Every job
# builds unsigned/self-signed artifacts when the relevant secrets are
# absent (nothing here fails a release for a maintainer who hasn't wired up
# store signing yet); real signing/upload kicks in once the secrets below
# are configured. Runs on `vX.Y.Z` tags, or manually via workflow_dispatch
# for a dry run against any ref.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  # Keep in sync with .github/workflows/ci.yml.
  FLUTTER_VERSION: '3.41.x'

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Android — signed AAB when ANDROID_KEYSTORE_BASE64 is set, debug-signed
  # otherwise (flutter's own fallback — see docs/release/android-signing.md).
  # ---------------------------------------------------------------------------
  android:
    name: Build Android AAB
    runs-on: ubuntu-latest
    # Secrets can't be referenced from a step's `if:` (GitHub rejects the whole
    # workflow with "Unrecognized named-value: 'secrets'"), so the ones that
    # gate a step are lifted to job-level env and tested via `env.*` below.
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Write release keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/openbike-upload.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=openbike-upload.jks
          EOF
      - run: flutter pub get
      - run: |
          flutter build appbundle --release \
            --dart-define=STRAVA_CLIENT_ID=${{ secrets.STRAVA_CLIENT_ID }} \
            --dart-define=STRAVA_CLIENT_SECRET=${{ secrets.STRAVA_CLIENT_SECRET }} \
            --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }}
      - uses: actions/upload-artifact@v4
        with:
          name: OpenBike-android
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # iOS — always produces an unsigned release archive so the job never fails
  # for lack of secrets; produces a real store-ready IPA only when Apple
  # distribution signing secrets are present. See docs/release/app-store.md.
  # ---------------------------------------------------------------------------
  ios:
    name: Build iOS
    runs-on: macos-latest
    # See the android job for why the gating secret is lifted to job-level env.
    env:
      IOS_DIST_CERTIFICATE_P12: ${{ secrets.IOS_DIST_CERTIFICATE_P12 }}
      IOS_DIST_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DIST_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      IOS_EXPORT_OPTIONS_PLIST_BASE64: ${{ secrets.IOS_EXPORT_OPTIONS_PLIST_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build (unsigned)
        run: flutter build ios --release --no-codesign
      - name: Import distribution certificate & provisioning profile
        if: env.IOS_DIST_CERTIFICATE_P12 != ''
        run: |
          echo "$IOS_DIST_CERTIFICATE_P12" | base64 --decode > certificate.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import certificate.p12 -k build.keychain -P "$IOS_DIST_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode \
            > ~/Library/MobileDevice/Provisioning\ Profiles/openbike.mobileprovision
          echo "$IOS_EXPORT_OPTIONS_PLIST_BASE64" | base64 --decode > ios/ExportOptions.plist
      - name: Build & export signed IPA
        if: env.IOS_DIST_CERTIFICATE_P12 != ''
        run: |
          flutter build ipa --release \
            --export-options-plist=ios/ExportOptions.plist \
            --dart-define=STRAVA_CLIENT_ID=${{ secrets.STRAVA_CLIENT_ID }} \
            --dart-define=STRAVA_CLIENT_SECRET=${{ secrets.STRAVA_CLIENT_SECRET }} \
            --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }}
      - uses: actions/upload-artifact@v4
        if: env.IOS_DIST_CERTIFICATE_P12 != ''
        with:
          name: OpenBike-ios
          path: build/ios/ipa/*.ipa
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # macOS — DMG, Developer ID signed + notarized when MACOS_CERTIFICATE_P12
  # is present, ad-hoc otherwise. See docs/release/macos-signing.md.
  # ---------------------------------------------------------------------------
  macos:
    name: Build macOS DMG
    runs-on: macos-latest
    # See the android job for why the gating secret is lifted to job-level env.
    env:
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: |
          flutter build macos --release \
            --dart-define=STRAVA_CLIENT_ID=${{ secrets.STRAVA_CLIENT_ID }} \
            --dart-define=STRAVA_CLIENT_SECRET=${{ secrets.STRAVA_CLIENT_SECRET }} \
            --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }}
      - name: Sign (Developer ID)
        if: env.MACOS_CERTIFICATE_P12 != ''
        run: |
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > certificate.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import certificate.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain
          codesign --deep --force --options runtime \
            --entitlements macos/Runner/Release.entitlements \
            --sign "$MACOS_SIGNING_IDENTITY" \
            "build/macos/Build/Products/Release/OpenBike.app"
      # Built with hdiutil rather than create-dmg. `--overwrite`/`--dmg-title`
      # are the npm create-dmg's flags, but `brew install create-dmg` gets
      # andreyvit's shell script, which rejects them ("Unknown option:
      # --dmg-title"). Its equivalent flags exist, but it drives Finder over
      # AppleScript to lay the window out, which is flaky on a headless
      # runner — and with no background artwork to place there is no layout
      # to preserve. hdiutil ships with macOS and needs no window server.
      - name: Package DMG
        run: |
          mkdir -p dmg-staging
          cp -R "build/macos/Build/Products/Release/OpenBike.app" dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create -volname OpenBike -srcfolder dmg-staging \
            -ov -format UDZO OpenBike.dmg
          hdiutil verify OpenBike.dmg
      - name: Notarize
        if: env.MACOS_CERTIFICATE_P12 != ''
        run: |
          xcrun notarytool submit OpenBike.dmg \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple OpenBike.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: OpenBike-macos
          path: OpenBike.dmg
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Windows — MSIX, self-signed by the msix tool unless a real code-signing
  # certificate is configured (Microsoft Store decision — default is a
  # GitHub Releases download; see docs/release/play-store.md's sibling
  # note in app-store.md for the equivalent desktop-store call).
  # ---------------------------------------------------------------------------
  windows:
    name: Build Windows MSIX
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: |
          flutter build windows --release `
            --dart-define=STRAVA_CLIENT_ID=${{ secrets.STRAVA_CLIENT_ID }} `
            --dart-define=STRAVA_CLIENT_SECRET=${{ secrets.STRAVA_CLIENT_SECRET }} `
            --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }}
      # `--install-certificate false` is required in CI. With no certificate
      # configured the tool self-signs with a generated test_certificate.pfx
      # and then asks, interactively, whether to install it into the local
      # trust store. On a runner stdin is not a TTY, so the prompt resolves
      # null and the tool dies with "type 'Null' is not a subtype of type
      # 'FutureOr<String>'". Trusting a throwaway cert on a disposable runner
      # would be pointless anyway — the artifact is for sideloading, and the
      # Store path (--store) is signed by Microsoft. See
      # docs/release/desktop-distribution.md.
      - run: dart run msix:create --build-windows false --install-certificate false
      - uses: actions/upload-artifact@v4
        with:
          name: OpenBike-windows
          path: build/windows/x64/runner/Release/*.msix
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Linux — best-effort per docs/roadmap/README.md's platform priority;
  # never blocks the release if it fails.
  # ---------------------------------------------------------------------------
  linux:
    name: Package Linux tar.gz
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev libjsoncpp-dev libcurl4-openssl-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: |
          flutter build linux --release \
            --dart-define=STRAVA_CLIENT_ID=${{ secrets.STRAVA_CLIENT_ID }} \
            --dart-define=STRAVA_CLIENT_SECRET=${{ secrets.STRAVA_CLIENT_SECRET }} \
            --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }}
      - name: Package tar.gz bundle
        run: |
          cd build/linux/x64/release/bundle
          tar czf ../../../../../OpenBike-linux-x64.tar.gz .
      # Linux has no OS-level code signing to satisfy, so a published checksum
      # is the whole integrity story for a direct download — see
      # docs/release/desktop-distribution.md ("If you stay on direct downloads").
      - name: Checksum the tarball
        run: sha256sum OpenBike-linux-x64.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: OpenBike-linux
          path: |
            OpenBike-linux-x64.tar.gz
            SHA256SUMS
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Attach every artifact produced above to a (draft) GitHub Release. Runs
  # regardless of individual platform outcomes so one platform's signing gap
  # never withholds the others — see docs/release/checklist.md.
  # ---------------------------------------------------------------------------
  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [android, ios, macos, windows, linux]
    if: always() && startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten artifacts into one directory
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name '*.aab' -o -name '*.ipa' -o -name '*.dmg' \
            -o -name '*.msix' -o -name '*.tar.gz' -o -name 'SHA256SUMS' \) \
            -exec cp {} release-assets/ \;
          ls -la release-assets
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          draft: true
          generate_release_notes: true
